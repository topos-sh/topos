[package]
name = "topos-harness"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "The TWO client-side harness ports, one responsibility each: HarnessAdapter says WHERE a bundle's bytes go (discovery + byte-exact placement targeting), TriggerAdapter says WHEN the update check fires ((un)installing one harness's auto-update trigger, its health probe, the artifacts it discloses). Content-blind: no translate/project. All platform/harness-version deps live here."

[dependencies]
topos-types.workspace = true
serde_json.workspace = true # strict-JSON config edit for the Claude Code settings.json hook (content-blind)
jsonc-parser.workspace = true # mcp: lossless JSON(C) CST upsert/remove of managed MCP entries (cursor/claude/opencode/openclaw)
toml_edit.workspace = true # mcp: format-preserving [mcp_servers.*] patch of Codex's config.toml
sha2.workspace = true # mcp: the structural entry fingerprint (sha256 over a canonical JSON rendering)
hex.workspace = true # mcp: fingerprint hex encoding (the shared std-crate codec)

[lints]
workspace = true
