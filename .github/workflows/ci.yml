name: ci

on:
  push:
    branches: [main]
  pull_request:
  # A tag push triggers neither event above, so release.yml runs this whole gate as a
  # reusable workflow instead — zero duplicated gate logic on the release path.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # plane-store's compile-time-checked queries read the committed `crates/plane-store/.sqlx` metadata
  # instead of opening a live database. The `test` job below provisions per-test databases at RUNTIME (via
  # `#[sqlx::test]`), and the `sqlx-drift` job regenerates the metadata and fails if it has drifted.
  SQLX_OFFLINE: "true"

jobs:
  gate:
    name: gate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macOS is TEMPORARILY off while the repo is private: private-repo macOS minutes bill at a 10x
        # multiplier against the free-plan allowance, and the macOS leg was proven green on this repo's
        # very first Actions run. Restore `macos-latest` here at the public flip (Actions minutes are
        # free on public repos).
        os: [ubuntu-latest]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      # Honors rust-toolchain.toml (pinned channel + rustfmt/clippy components) — do NOT pin a
      # channel here, or it would override the repo's reproducible toolchain.
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
      - name: format
        run: cargo fmt --all --check
      # Compiles every target (incl. the test binaries' `query!`s) against the committed `.sqlx` — no
      # database needed on either OS.
      - name: clippy (warnings are errors)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # Doc-comments are load-bearing: topos-types `///`s become the committed JSON-Schema field
      # descriptions, and intra-doc links must not rot. Deny rustdoc warnings.
      - name: docs (broken intra-doc links are errors)
        run: cargo doc --workspace --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings
      - name: contract drift gate (schemas)
        run: cargo run -p xtask --locked -- gen-schema --check
      - name: contract drift gate (fixtures)
        run: cargo run -p xtask --locked -- gen-fixtures --check
      # `docs/cli.md` and the built-in skill's `reference.md` both render from the real clap tree —
      # and their agent tables render from registry.toml, so table churn moves them too.
      - name: contract drift gate (cli reference)
        run: cargo run -p xtask --locked -- gen-cli-ref --check
      # The harness table the binary embeds and the copy the web app serves are one file — a byte
      # compare, because a client compares the served version against the one it was compiled with.
      - name: contract drift gate (harness registry)
        run: cargo run -p xtask --locked -- gen-registry --check
      - name: architectural layering
        run: cargo run -p xtask --locked -- check-arch

  # The suite is split from the matrix `gate` because `#[sqlx::test]` provisions a fresh database per test at
  # runtime — that needs a live Postgres, and a service container is Linux-only. Compilation stays offline
  # (the committed `.sqlx`); the service is purely the runtime target the per-test databases are created on.
  test:
    name: test (ubuntu, postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: topos
          POSTGRES_PASSWORD: topos
          POSTGRES_DB: topos
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: "postgres://topos:topos@localhost:5432/topos"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
      # The composed-stack e2e (tests/) spawns the web app IN FRONT of the loopback plane — the
      # door-cutover topology — so the suite needs bun + the app's production build on disk.
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: 1.3.10
      - name: build the web app (the composed e2e spawns it)
        working-directory: web
        run: bun install --frozen-lockfile && bun run build
      - name: test
        run: cargo test --workspace --locked

  # A machine decides whether to keep a downloaded harness table by comparing its `version` against
  # the one it already holds, and refuses an EQUAL version whose bytes changed — so a table edited
  # without a bump is a table that either never lands or lands as an error, depending on which
  # machine sees it first. The bump is a hand edit; this is what remembers it. Needs full history:
  # the comparison is against the merge base, and a shallow checkout has no such commit.
  registry-version:
    name: harness registry version guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
      - name: an edited harness table carries a greater version
        run: |
          set -eu
          file=crates/topos-harness/registry.toml
          git fetch --no-tags --quiet origin main
          base=$(git merge-base HEAD FETCH_HEAD)
          if git diff --quiet "$base" HEAD -- "$file"; then
            echo "$file is unchanged since $base — nothing to check"
            exit 0
          fi
          read_version() { sed -n 's/^version = "\(.*\)"$/\1/p' | head -1; }
          after=$(read_version < "$file")
          # A table that did not exist at the base is the FIRST one: there is no prior version to
          # be greater than, so the guard only asks that the version it states is readable.
          if git cat-file -e "$base:$file" 2>/dev/null; then
            before=$(git show "$base:$file" | read_version)
          else
            before=
          fi
          echo "$file changed: ${before:-<new file>} -> $after"
          python3 - "${before:-}" "$after" <<'PY'
          import sys
          def parts(v):
              if not v or any(not s.isdigit() for s in v.split(".")):
                  sys.exit(f"harness registry version {v!r} is not dotted-numeric")
              return [int(s) for s in v.split(".")]
          after = parts(sys.argv[2])
          if not sys.argv[1]:
              sys.exit(0)  # a brand-new table: nothing to be newer than
          before = parts(sys.argv[1])
          width = max(len(before), len(after))
          before += [0] * (width - len(before))
          after += [0] * (width - len(after))
          if after <= before:
              sys.exit(
                  f"harness registry edited without a version bump: {sys.argv[2]} is not greater "
                  f"than {sys.argv[1]} — clients keep the copy they have, and an equal version "
                  f"with different bytes is refused as an error"
              )
          PY

  deny:
    name: cargo-deny (advisories + licenses)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: EmbarkStudios/cargo-deny-action@bb137d7af7e4fb67e5f82a49c4fce4fad40782fe # v2.0.20
        with:
          # The action's container ships its own default toolchain, and rustup fails on this repo's
          # rust-toolchain.toml override unless the pinned version is installed. Pin-pair with
          # rust-toolchain.toml — `check-arch` asserts the two stay in lockstep.
          rust-version: "1.96.0"

  # The self-host packaging gets the same regression protection as the code: build the image, start the
  # compose stack, prove the plane answers a DATABASE-BACKED request, tear it down. Push-to-main only —
  # the job docker-builds the whole workspace in release mode (minutes), which would dominate PR latency,
  # and the packaging surface changes rarely, so post-merge coverage is the right trade. (The Dockerfile's
  # rust tag is separately pinned to rust-toolchain.toml by `check-arch`, which DOES run on every PR.)
  compose-smoke:
    name: compose smoke (self-host packaging)
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: build + start the stack, probe a database-backed read, tear down
        run: ./scripts/compose-smoke.sh

  sqlx-drift:
    name: sqlx offline-metadata drift gate
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: topos
          POSTGRES_PASSWORD: topos
          POSTGRES_DB: topos
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # This job regenerates the query metadata against a live database, so it must NOT read the
      # committed `.sqlx` — override the workspace-wide offline flag.
      SQLX_OFFLINE: "false"
      DATABASE_URL: "postgres://topos:topos@localhost:5432/topos"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
      # Pin the CLI to the EXACT library version. A bare `cargo install sqlx-cli` resolves to a newer
      # major whose generated metadata format differs from the pinned library's, which would silently
      # turn this drift gate into a no-op.
      - name: install sqlx-cli (pinned to the library version, postgres driver)
        run: cargo install sqlx-cli --version 0.8.6 --locked --no-default-features --features rustls,postgres
      - name: migrate the database (the service created it empty)
        run: sqlx migrate run --source crates/plane-store/migrations
      # `-- --tests --features test-fixtures` matches the scope the committed metadata was generated with:
      # the seed/shim queries are gated `#[cfg(any(test, feature = "test-fixtures"))]`, so both `--tests`
      # (the `test` cfg) and `--features test-fixtures` activate them. Covering the feature here keeps the
      # downstream-facing shims (which the HERO + plane route tests drive) under the drift gate too. (sqlx's
      # `prepare` forwards every token after `--` to the build, so `--features` belongs there, not before it.)
      - name: prepare --check (fails if the committed .sqlx has drifted from the schema)
        working-directory: crates/plane-store
        run: cargo sqlx prepare --check -- --tests --features test-fixtures

  # The web app: the static gates (biome + typegen/tsc + design tokens + boundary + contract), the
  # unit suite (provisions a scratch database per run on the service Postgres), and the Playwright
  # e2e (the fixture vault + a bootstrapped topos_e2e database — db-setup.mjs creates the app roles
  # itself, so the virgin service container is enough).
  web:
    name: web (check + unit + e2e)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/postgres"
      E2E_MAINTENANCE_URL: "postgres://postgres:postgres@localhost:5432/postgres"
      E2E_ADMIN_URL: "postgres://postgres:postgres@localhost:5432/topos_e2e"
      DATABASE_URL: "postgres://topos_web:web@localhost:5432/topos_e2e"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: 1.3.10
      - name: install
        run: bun install --frozen-lockfile
      # The cross-lane grants shape, probed by LOGGING IN as each role (SET ROLE does not
      # adopt a role's search_path): the app cannot write/ALTER/CREATE-IN plane, the vault
      # cannot read web, and future plane tables arrive already SELECT-granted. --self-test
      # proves the gate itself fires on a broken grant shape.
      - name: db grants shape (+ gate self-test)
        working-directory: .
        run: PGHOST=localhost PGPORT=5432 PGUSER=postgres PGPASSWORD=postgres sh scripts/check-db-grants.sh --self-test
      - name: check (biome + typegen + tsc + tokens + boundary + contract)
        run: bun run check
      # The client-bundle leak gate needs a real build to scan — build once, then byte-scan
      # build/client for every server secret name.
      - name: build + bundle leak scan
        run: bun run build && bun run check:bundle
      - name: unit tests
        run: bunx vitest run
      # Two independent flakes live in this one command, so it is split in two. The apt system
      # deps (install-deps) stall on a slow mirror and MUST NOT be killed mid-run — a timeout that
      # kills apt orphans its lock and dooms every retry ("Could not get lock"); instead retry and
      # clear a stale lock between tries. The browser binary (install) comes off a CDN that once
      # held a connection open for over an hour, so THAT is the part bounded by a timeout and
      # retried — killing a download is safe, killing apt is not.
      - name: install chromium
        run: |
          deps_ok=0
          for attempt in 1 2 3; do
            if bunx playwright install-deps chromium; then deps_ok=1; break; fi
            echo "::warning::system-deps attempt ${attempt} failed; clearing apt locks"
            sudo rm -f /var/lib/apt/lists/lock /var/cache/apt/archives/lock \
              /var/lib/dpkg/lock /var/lib/dpkg/lock-frontend 2>/dev/null || true
            sudo dpkg --configure -a 2>/dev/null || true
            sleep 20
          done
          [ "$deps_ok" = 1 ] || { echo "::error::playwright system deps failed after 3 attempts"; exit 1; }
          for attempt in 1 2 3; do
            if timeout 300 bunx playwright install chromium; then exit 0; fi
            echo "::warning::browser download attempt ${attempt} stalled or failed; retrying"
          done
          echo "::error::chromium browser download failed after 3 attempts"
          exit 1
      # The database must exist BEFORE the suite: Playwright launches the web servers ahead of
      # globalSetup, and the served app's readiness probe is a database-backed /healthz.
      - name: e2e
        run: node tests/e2e/db-setup.mjs && bunx playwright test

  # The MCP gateway: the static gate (tsc over the engine, the container host and the suites) and
  # the suites themselves. Its DB tests provision a scratch database per run on the service
  # Postgres, create both application roles and apply the PRODUCTION grant design, then run the
  # WEB drizzle lineage beside the gateway's own — because what they prove is a CROSS-SCHEMA
  # boundary, and half a database could not show it. That is why this job installs web's
  # dependencies too: the rig drives the real `web/scripts/migrate.mjs` under plain node.
  gateway:
    name: gateway (check + tests)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # A superuser on the maintenance database: the rig creates (and drops) its own scratch
      # database and both login roles from here. Without it the DB suites FAIL — they never skip.
      TEST_DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/postgres"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: 1.3.10
      - name: install (web — the scratch-database rig runs its migration lineage)
        working-directory: web
        run: bun install --frozen-lockfile
      - name: install (gateway)
        working-directory: gateway
        run: bun install --frozen-lockfile
      - name: check (tsc)
        working-directory: gateway
        run: bun run check
      # `bun run test` is vitest, deliberately — `bun test` is bun's own runner, which this repo
      # keeps out of every TypeScript package for the same reason the web app does.
      - name: tests
        working-directory: gateway
        run: bun run test
