# The harness registry — ONE row per agent harness, and the SOURCE OF TRUTH for the table
# `topos_harness::registry` serves. The binary embeds this file (`include_str!`); the web app
# serves these exact bytes at `/harness-registry.toml`; a machine may carry a newer copy of it
# under `~/.topos/harness-registry/` without a new release.
#
# Rows are kept in `vercel-labs/skills`'s `src/agents.ts` file order, which fixes the "first
# matching harness" tie-break for a shared dir — moving a row changes behaviour.
#
# Every dir is `<root-tag>/<suffix>`: `home`, `configHome`, `appSupport`, `codexHome`, `claudeHome`,
# `vibeHome`, `hermesHome`, `autohandHome`, `grokHome`, `cwd`, `APPDATA` or
# `FLATPAK_XDG_CONFIG_HOME`. Each root resolves through its own env override, falling back to a
# `home`-relative default. `appSupport` is the one whose base differs by PLATFORM — macOS
# `~/Library/Application Support`, Windows `%APPDATA%`, elsewhere the XDG config home — which is
# what an app following each platform's own convention (rather than XDG everywhere) needs.
# NO ROW MAY NAME AN ABSOLUTE PATH. The grammar still spells one (a leading `/`) and only this
# file could carry it — but these bytes are also the SERVED copy, which every client reads under
# the fenced rules that refuse absolute paths, and one refused dir refuses the whole file. A row
# that wants a system-install probe gets a home-rooted one instead.
#
# `version` is dotted numeric and MUST be bumped by hand on every edit: a downloaded copy is
# accepted only when it is strictly newer than the copy the reading binary was built with, and a
# same-version file whose bytes differ is an error, never a silent update.
#
# `schema_version` is the GRAMMAR (a reader that does not know it refuses the file whole);
# `min_engine_version` is what a reader must PROVIDE to be allowed to read this file.
#
# A `[harness.mcp]` block carries three CAPABILITY columns, each stated only where the row is
# unusual: `remote` (the agent dials an https MCP address itself — true unless stated), `stdio`
# (the agent runs a local program as a server — true unless stated), and `env_ref` (how the agent
# spells a reference to an environment variable inside an entry: `dollar-brace` = `${VAR}`,
# `brace-env` = `{env:VAR}`, `dollar-brace-env` = `${env:VAR}`; `dollar-brace` unless stated).

schema_version = 1
version = "2026.8.13.4"
min_engine_version = 3

# The remote-to-stdio BRIDGE: the program topos runs so an agent that cannot dial an MCP address
# reaches one anyway. Pinned to one exact version, because every machine in a workspace runs the
# same bytes. FENCED: a downloaded table may say which agents need the bridge (the per-row `remote`
# column) and may never change which program runs — a copy naming a different bridge is refused
# whole, and the served copy is these bytes, so it lands.
[mcp_bridge]
package = "mcp-remote"
version = "0.1.38"

