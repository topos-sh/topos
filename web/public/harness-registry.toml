# READ-ONLY. Claude Code also keeps MCP servers in `~/.claude.json` — once at user scope and once
# per project it remembers — and de-duplicates servers BY URL, with those scopes winning over the
# plugin dir topos writes. An entry placed over one of them would never appear in the agent while
# topos reported it installed, so both slots are read before a placement and never written.
# `.claude.json` sits beside the config dir, so it is named under BOTH roots: `$HOME` when Claude
# Code is at its default, and the config dir itself when `$CLAUDE_CONFIG_DIR` moves it.
[[harness.mcp.conflict_paths]]
file = "home/.claude.json"
dialect = "claude-project-json"
selector = "mcpServers"

