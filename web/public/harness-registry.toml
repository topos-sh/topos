# The user's ENTIRE editor configuration, comments and all. Zed keeps it under the XDG config home
# on macOS too; the Windows and Flatpak spellings above are detection probes this one surface does
# not follow.
user = { dir = "configHome/zed/settings.json", dialect = "zed-json" }

[[harness]]
# Detected by its home config dir. The macOS app-bundle probe the reference also uses is
# deliberately GONE: an absolute path makes this file unreadable at every fenced origin, and this
# file is also the served one.
slug = "zcode"
display_name = "ZCode"
user_dirs = ["home/.zcode/skills"]
project_dir = ".zcode/skills"
detect_dirs = ["home/.zcode"]

[[harness]]
slug = "zencoder"
display_name = "Zencoder"
user_dirs = ["home/.zencoder/skills"]
project_dir = ".zencoder/skills"
detect_dirs = ["home/.zencoder"]

[[harness]]
slug = "zenflow"
display_name = "Zenflow"
user_dirs = ["home/.zencoder/skills"]
project_dir = ".zencoder/skills"
detect_dirs = ["home/.zencoder"]

[[harness]]
slug = "neovate"
display_name = "Neovate"
user_dirs = ["home/.neovate/skills"]
project_dir = ".neovate/skills"
detect_dirs = ["home/.neovate"]

[[harness]]
slug = "pochi"
display_name = "Pochi"
user_dirs = ["home/.pochi/skills"]
project_dir = ".pochi/skills"
detect_dirs = ["home/.pochi"]

[[harness]]
# A cwd-only harness: no global scope at all, so it has no user dir.
slug = "promptscript"
display_name = "PromptScript"
user_dirs = []
project_dir = ".agents/skills"
detect_dirs = ["cwd/.promptscript", "cwd/promptscript.yaml"]

[[harness]]
slug = "adal"
display_name = "AdaL"
user_dirs = ["home/.adal/skills"]
project_dir = ".adal/skills"
detect_dirs = ["home/.adal"]

[[harness]]
# The last three rows are MCP-ONLY: apps that run MCP servers and read no skills folder at all, so
# they carry no skills dirs and never claim one. They sit at the end because row order is the
# tie-break for a SHARED skills dir, and a row claiming none can never win one.
slug = "vscode"
display_name = "VS Code"
user_dirs = []
project_dir = ""
detect_dirs = ["appSupport/Code/User"]

[harness.mcp]
reload_note = "restart the server from VS Code's MCP view"
# `servers`, not `mcpServers` — and beside it stand `inputs` and `sandbox`, which are the user's.
user = { dir = "appSupport/Code/User/mcp.json", dialect = "vscode-json" }
project = { path = ".vscode/mcp.json", dialect = "vscode-json" }
env_ref = "dollar-brace-env"

[[harness]]
slug = "lm-studio"
display_name = "LM Studio"
user_dirs = []
project_dir = ""
detect_dirs = ["home/.lmstudio"]

# An ADDRESS and nothing else: LM Studio's documented entry is a url with optional headers, and no
# documented entry of its own runs a local program — so a bundle that offers only a package is
# reported unplaceable here rather than written in an invented shape.
[harness.mcp]
reload_note = "loads automatically when the file is saved"
user = { dir = "home/.lmstudio/mcp.json", dialect = "lm-studio-json" }
stdio = false

[[harness]]
slug = "claude-desktop"
display_name = "Claude Desktop"
user_dirs = []
project_dir = ""
detect_dirs = ["appSupport/Claude"]

# The MIRROR of LM Studio: a PROGRAM and nothing else. Claude Desktop's remote servers are added
# in the app, through a flow no config file takes part in, so a shared address reaches it the one
# way this file can express — the bridge.
[harness.mcp]
reload_note = "quit Claude Desktop completely and reopen it"
user = { dir = "appSupport/Claude/claude_desktop_config.json", dialect = "claude-desktop-json" }
remote = false

[[harness]]
# The SENTINEL row: no detection probe, so it is never independently present — its dirs are
# covered by the concrete harnesses that share them.
slug = "universal"
display_name = "Universal"
user_dirs = ["configHome/agents/skills"]
project_dir = ".agents/skills"
detect_dirs = []
